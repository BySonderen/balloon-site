<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon in the Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0F6 40%, #d4effc 100%);
    cursor: default;
  }

  /* ---- Clouds ---- */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(1px);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }

  /* ---- Plane ---- */
  .plane {
    position: absolute;
    font-size: 32px;
    will-change: transform;
    pointer-events: none;
    user-select: none;
  }

  /* ---- Balloon ---- */
  #balloon {
    position: absolute;
    width: 140px;
    height: 170px;
    cursor: pointer;
    z-index: 10;
    transition: filter 0.15s;
    will-change: transform;
  }
  #balloon:hover { filter: brightness(1.15); }

  .balloon-body {
    width: 140px;
    height: 170px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    box-shadow: inset -12px -8px 20px rgba(0,0,0,0.15), inset 10px 10px 20px rgba(255,255,255,0.35);
    transition: background 0.3s;
  }

  .balloon-knot {
    width: 12px;
    height: 12px;
    background: inherit;
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 4px 0;
  }

  .balloon-string {
    width: 2px;
    height: 80px;
    background: rgba(0,0,0,0.25);
    position: absolute;
    left: 50%;
    top: 170px;
    transform: translateX(-50%);
    border-radius: 0 0 2px 2px;
  }

  /* pop animation */
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.35s ease-out; }

  /* ---- Welcome Text ---- */
  #welcome {
    position: absolute;
    font-size: 48px;
    font-weight: bold;
    color: #2c3e50;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    cursor: pointer;
    z-index: 5;
    user-select: none;
    transition: left 0.6s ease, top 0.6s ease;
  }

  @keyframes shiver {
    0%   { transform: translate(0, 0) rotate(0deg); }
    5%   { transform: translate(-6px, 4px) rotate(-4deg); }
    10%  { transform: translate(7px, -3px) rotate(5deg); }
    15%  { transform: translate(-5px, -6px) rotate(-3deg); }
    20%  { transform: translate(6px, 5px) rotate(4deg); }
    25%  { transform: translate(-8px, 2px) rotate(-5deg); }
    30%  { transform: translate(5px, -5px) rotate(3deg); }
    35%  { transform: translate(-4px, 7px) rotate(-4deg); }
    40%  { transform: translate(7px, -2px) rotate(5deg); }
    45%  { transform: translate(-6px, -4px) rotate(-3deg); }
    50%  { transform: translate(8px, 3px) rotate(4deg); }
    55%  { transform: translate(-5px, 6px) rotate(-5deg); }
    60%  { transform: translate(6px, -6px) rotate(3deg); }
    65%  { transform: translate(-7px, 2px) rotate(-4deg); }
    70%  { transform: translate(4px, 5px) rotate(5deg); }
    75%  { transform: translate(-6px, -3px) rotate(-3deg); }
    80%  { transform: translate(7px, 4px) rotate(4deg); }
    85%  { transform: translate(-5px, -5px) rotate(-5deg); }
    90%  { transform: translate(6px, 3px) rotate(3deg); }
    95%  { transform: translate(-4px, -2px) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .shiver { animation: shiver 0.8s ease-in-out; }

  /* ---- Name Input ---- */
  #nameField {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
  }
  #nameInput {
    padding: 10px 20px;
    font-size: 18px;
    border: 3px solid rgba(255,255,255,0.7);
    border-radius: 25px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(8px);
    outline: none;
    color: #2c3e50;
    font-weight: bold;
    text-align: center;
    width: 260px;
    transition: border-color 0.3s;
  }
  #nameInput::placeholder { color: #7f8c8d; font-weight: normal; }
  #nameInput:focus { border-color: #e0243a; }

  /* ---- Sun ---- */
  #sun {
    position: absolute;
    top: 40px;
    right: 80px;
    width: 120px;
    height: 120px;
    z-index: 2;
  }
  .sun-body {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 40% 40%, #fff4a3, #f9d71c 40%, #f0a500);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 40px 15px rgba(249,215,28,0.35), 0 0 80px 30px rgba(249,215,28,0.15);
  }
  .sun-ray {
    position: absolute;
    width: 8px;
    height: 25px;
    background: #f9d71c;
    border-radius: 4px;
    top: 50%;
    left: 50%;
    transform-origin: center -35px;
    opacity: 0.6;
  }
  .sun-face {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  .sun-eye {
    position: absolute;
    top: 40px;
    width: 12px;
    height: 14px;
    background: #5d4037;
    border-radius: 50%;
    transition: transform 0.15s;
  }
  .sun-eye.left { left: 35px; }
  .sun-eye.right { right: 35px; }
  .sun-eye.wink {
    height: 3px;
    border-radius: 3px;
    top: 46px;
  }
  .sun-mouth {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 35px;
    height: 16px;
    border-bottom: 4px solid #5d4037;
    border-radius: 0 0 20px 20px;
  }
  .sun-cheek {
    position: absolute;
    top: 52px;
    width: 16px;
    height: 10px;
    background: rgba(255,120,100,0.35);
    border-radius: 50%;
  }
  .sun-cheek.left { left: 22px; }
  .sun-cheek.right { right: 22px; }
</style>
</head>
<body>

<!-- Sun -->
<div id="sun">
  <div class="sun-body">
    <div class="sun-face">
      <div class="sun-eye left" id="sunEyeL"></div>
      <div class="sun-eye right" id="sunEyeR"></div>
      <div class="sun-mouth"></div>
      <div class="sun-cheek left"></div>
      <div class="sun-cheek right"></div>
    </div>
  </div>
</div>

<!-- Welcome Text -->
<div id="welcome">Welcome Dude!</div>

<!-- Name Input -->
<div id="nameField">
  <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="20">
</div>

<!-- Balloon -->
<div id="balloon">
  <div class="balloon-body" id="balloonBody" style="background: #e0243a;">
    <div class="balloon-knot" style="background: #c01e32;"></div>
  </div>
  <div class="balloon-string"></div>
</div>

<script>
/* =========  SUN RAYS  ========= */
const sunBody = document.querySelector('.sun-body');
for (let i = 0; i < 12; i++) {
  const ray = document.createElement('div');
  ray.className = 'sun-ray';
  ray.style.transform = `rotate(${i * 30}deg) translateY(-82px)`;
  sunBody.appendChild(ray);
}

/* =========  SUN WINK  ========= */
const eyeL = document.getElementById('sunEyeL');
const eyeR = document.getElementById('sunEyeR');

function sunWink() {
  eyeR.classList.add('wink');
  setTimeout(() => eyeR.classList.remove('wink'), 400);
  setTimeout(sunWink, 4000 + Math.random() * 6000);
}
setTimeout(sunWink, 3000);

/* =========  BALLOON MOVEMENT  ========= */
const balloon = document.getElementById('balloon');
const bBody   = document.getElementById('balloonBody');
const knot    = bBody.querySelector('.balloon-knot');

let bx = window.innerWidth / 2 - 45;
let by = window.innerHeight / 2 - 55;
let targetX = bx, targetY = by;
const speed = 0.012;
const margin = 60;

function pickTarget() {
  targetX = margin + Math.random() * (window.innerWidth  - 2 * margin - 90);
  targetY = margin + Math.random() * (window.innerHeight - 2 * margin - 190);
}
pickTarget();
setInterval(pickTarget, 2000 + Math.random() * 2000);

let wobble = 0;
function moveBalloon() {
  bx += (targetX - bx) * speed;
  by += (targetY - by) * speed;
  wobble += 0.03;
  const sway = Math.sin(wobble) * 8;
  balloon.style.transform = `translate(${bx}px, ${by}px) rotate(${sway}deg)`;
  requestAnimationFrame(moveBalloon);
}
moveBalloon();

/* =========  BALLOON CLICK  ========= */
let isRed = true;

balloon.addEventListener('click', () => {
  const c = isRed ? '#27ae60' : '#e0243a';
  const k = isRed ? '#1e8449' : '#c01e32';
  isRed = !isRed;
  bBody.style.background = c;
  knot.style.background = k;
  bBody.classList.remove('pop');
  void bBody.offsetWidth;
  bBody.classList.add('pop');
});

/* =========  CLOUDS  ========= */
function spawnCloud() {
  const c = document.createElement('div');
  c.className = 'cloud';
  const size = 60 + Math.random() * 100;
  const top  = Math.random() * (window.innerHeight * 0.55);
  c.style.width  = size + 'px';
  c.style.height = size * 0.6 + 'px';
  c.style.top    = top + 'px';
  c.style.left   = -size + 'px';
  c.style.opacity = 0.7 + Math.random() * 0.25;

  const before = document.createElement('style');
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  c.id = id;
  const p1w = size * (0.5 + Math.random() * 0.3);
  const p2w = size * (0.4 + Math.random() * 0.3);
  before.textContent = `
    #${id}::before { width:${p1w}px; height:${p1w*0.7}px; top:-${p1w*0.35}px; left:${size*0.15}px; }
    #${id}::after  { width:${p2w}px; height:${p2w*0.7}px; top:-${p2w*0.2}px;  left:${size*0.45}px; }
  `;
  document.head.appendChild(before);
  document.body.appendChild(c);

  const duration = 30000 + Math.random() * 40000;
  const dest = window.innerWidth + size;
  const start = performance.now();

  function drift(now) {
    const t = (now - start) / duration;
    if (t > 1) { c.remove(); before.remove(); return; }
    c.style.left = (-size + t * (dest + size)) + 'px';
    requestAnimationFrame(drift);
  }
  requestAnimationFrame(drift);
}

for (let i = 0; i < 6; i++) setTimeout(() => spawnCloud(), i * 800);
setInterval(spawnCloud, 6000 + Math.random() * 4000);

/* =========  PLANES  ========= */
function spawnPlane() {
  const p = document.createElement('div');
  p.className = 'plane';
  const goRight = Math.random() > 0.5;
  const top = 30 + Math.random() * (window.innerHeight * 0.35);
  const sz  = 48 + Math.random() * 24;
  p.style.fontSize = sz + 'px';
  p.style.top = top + 'px';
  p.textContent = goRight ? '✈️' : '✈️';
  p.style.transform = goRight ? 'scaleX(1)' : 'scaleX(-1)';

  const startX = goRight ? -80 : window.innerWidth + 80;
  const endX   = goRight ? window.innerWidth + 80 : -80;
  p.style.left = startX + 'px';
  document.body.appendChild(p);

  const duration = 12000 + Math.random() * 10000;
  const start = performance.now();

  function fly(now) {
    const t = (now - start) / duration;
    if (t > 1) { p.remove(); return; }
    p.style.left = (startX + t * (endX - startX)) + 'px';
    requestAnimationFrame(fly);
  }
  requestAnimationFrame(fly);
}

setTimeout(spawnPlane, 3000);
setInterval(spawnPlane, 8000 + Math.random() * 10000);

/* =========  WELCOME TEXT  ========= */
const welcome = document.getElementById('welcome');
welcome.style.left = (window.innerWidth / 2 - 150) + 'px';
welcome.style.top = (window.innerHeight / 2 - 30) + 'px';

welcome.addEventListener('click', () => {
  welcome.classList.remove('shiver');
  void welcome.offsetWidth;
  welcome.classList.add('shiver');

  const newX = 60 + Math.random() * (window.innerWidth - 400);
  const newY = 40 + Math.random() * (window.innerHeight - 160);
  welcome.style.left = newX + 'px';
  welcome.style.top = newY + 'px';
});

/* =========  NAME INPUT  ========= */
const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('input', () => {
  const name = nameInput.value.trim();
  welcome.textContent = name ? `Welcome ${name}!` : 'Welcome Dude!';
});

/* =========  RESIZE SAFETY  ========= */
window.addEventListener('resize', pickTarget);
</script>
</body>
</html>
