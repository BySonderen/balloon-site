<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon in the Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #74b9d9 0%, #9ccde6 40%, #bde0ef 100%);
    cursor: default;
  }

  /* ---- Clouds ---- */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(1px);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }

  /* ---- Plane ---- */
  .plane-wrapper {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 3;
  }
  .plane-icon {
    font-size: 52px;
    display: inline-block;
  }

  /* ---- Smoke puffs ---- */
  .smoke-puff {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 50%, transparent 70%);
    pointer-events: none;
    z-index: 2;
  }

  /* ---- Smoke text ---- */
  .smoke-letter {
    position: absolute;
    font-size: 72px;
    font-weight: 900;
    font-family: 'Arial Black', Arial, sans-serif;
    color: transparent;
    background: radial-gradient(ellipse, rgba(255,255,255,0.95) 0%, rgba(240,240,240,0.7) 60%, transparent 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: blur(1.5px);
    pointer-events: none;
    z-index: 2;
    user-select: none;
    text-shadow: 0 0 8px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4);
  }

  /* ---- Balloon ---- */
  #balloon {
    position: absolute;
    width: 70px;
    height: 85px;
    cursor: pointer;
    z-index: 10;
    transition: filter 0.15s;
    will-change: transform;
  }
  #balloon:hover { filter: brightness(1.15); }

  .balloon-body {
    width: 70px;
    height: 85px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    box-shadow: inset -8px -5px 14px rgba(0,0,0,0.15), inset 6px 6px 14px rgba(255,255,255,0.35);
    transition: background 0.3s;
  }

  .balloon-knot {
    width: 10px;
    height: 10px;
    background: inherit;
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 3px 0;
  }

  .balloon-string {
    width: 2px;
    height: 50px;
    background: rgba(0,0,0,0.25);
    position: absolute;
    left: 50%;
    top: 85px;
    transform: translateX(-50%);
    border-radius: 0 0 2px 2px;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.35s ease-out; }

  /* ---- Welcome Text ---- */
  #welcome {
    position: absolute;
    font-size: 48px;
    font-weight: bold;
    color: #2c3e50;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    cursor: pointer;
    z-index: 5;
    user-select: none;
    transition: left 0.6s ease, top 0.6s ease;
  }

  @keyframes shiver {
    0%   { transform: translate(0, 0) rotate(0deg); }
    5%   { transform: translate(-6px, 4px) rotate(-4deg); }
    10%  { transform: translate(7px, -3px) rotate(5deg); }
    15%  { transform: translate(-5px, -6px) rotate(-3deg); }
    20%  { transform: translate(6px, 5px) rotate(4deg); }
    25%  { transform: translate(-8px, 2px) rotate(-5deg); }
    30%  { transform: translate(5px, -5px) rotate(3deg); }
    35%  { transform: translate(-4px, 7px) rotate(-4deg); }
    40%  { transform: translate(7px, -2px) rotate(5deg); }
    45%  { transform: translate(-6px, -4px) rotate(-3deg); }
    50%  { transform: translate(8px, 3px) rotate(4deg); }
    55%  { transform: translate(-5px, 6px) rotate(-5deg); }
    60%  { transform: translate(6px, -6px) rotate(3deg); }
    65%  { transform: translate(-7px, 2px) rotate(-4deg); }
    70%  { transform: translate(4px, 5px) rotate(5deg); }
    75%  { transform: translate(-6px, -3px) rotate(-3deg); }
    80%  { transform: translate(7px, 4px) rotate(4deg); }
    85%  { transform: translate(-5px, -5px) rotate(-5deg); }
    90%  { transform: translate(6px, 3px) rotate(3deg); }
    95%  { transform: translate(-4px, -2px) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .shiver { animation: shiver 0.8s ease-in-out; }

  /* ---- Name Input ---- */
  #nameField {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
  }
  #nameInput {
    padding: 10px 20px;
    font-size: 18px;
    border: 3px solid rgba(255,255,255,0.7);
    border-radius: 25px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(8px);
    outline: none;
    color: #2c3e50;
    font-weight: bold;
    text-align: center;
    width: 260px;
    transition: border-color 0.3s;
  }
  #nameInput::placeholder { color: #7f8c8d; font-weight: normal; }
  #nameInput:focus { border-color: #e0243a; }

  /* ---- Sun ---- */
  #sun {
    position: absolute;
    top: 40px;
    right: 80px;
    width: 120px;
    height: 120px;
    z-index: 2;
  }
  .sun-body {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 40% 40%, #fff4a3, #f9d71c 40%, #f0a500);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 40px 15px rgba(249,215,28,0.35), 0 0 80px 30px rgba(249,215,28,0.15);
  }
  .sun-ray {
    position: absolute;
    width: 8px;
    height: 25px;
    background: #f9d71c;
    border-radius: 4px;
    top: 50%;
    left: 50%;
    transform-origin: center -35px;
    opacity: 0.6;
  }
  .sun-face { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .sun-eye {
    position: absolute;
    top: 40px;
    width: 12px;
    height: 14px;
    background: #5d4037;
    border-radius: 50%;
    transition: transform 0.15s;
  }
  .sun-eye.left { left: 35px; }
  .sun-eye.right { right: 35px; }
  .sun-eye.wink { height: 3px; border-radius: 3px; top: 46px; }
  .sun-mouth {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 35px;
    height: 16px;
    border-bottom: 4px solid #5d4037;
    border-radius: 0 0 20px 20px;
  }
  .sun-cheek {
    position: absolute;
    top: 52px;
    width: 16px;
    height: 10px;
    background: rgba(255,120,100,0.35);
    border-radius: 50%;
  }
  .sun-cheek.left { left: 22px; }
  .sun-cheek.right { right: 22px; }
</style>
</head>
<body>

<!-- Sun -->
<div id="sun">
  <div class="sun-body">
    <div class="sun-face">
      <div class="sun-eye left" id="sunEyeL"></div>
      <div class="sun-eye right" id="sunEyeR"></div>
      <div class="sun-mouth"></div>
      <div class="sun-cheek left"></div>
      <div class="sun-cheek right"></div>
    </div>
  </div>
</div>

<!-- Welcome Text -->
<div id="welcome">Welcome Dude!</div>

<!-- Name Input -->
<div id="nameField">
  <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="20">
</div>

<!-- Balloon -->
<div id="balloon">
  <div class="balloon-body" id="balloonBody" style="background: #e0243a;">
    <div class="balloon-knot" style="background: #c01e32;"></div>
  </div>
  <div class="balloon-string"></div>
</div>

<script>
/* =========  SUN RAYS  ========= */
const sunBody = document.querySelector('.sun-body');
for (let i = 0; i < 12; i++) {
  const ray = document.createElement('div');
  ray.className = 'sun-ray';
  ray.style.transform = `rotate(${i * 30}deg) translateY(-82px)`;
  sunBody.appendChild(ray);
}

/* =========  SUN WINK  ========= */
const eyeR = document.getElementById('sunEyeR');
function sunWink() {
  eyeR.classList.add('wink');
  setTimeout(() => eyeR.classList.remove('wink'), 400);
  setTimeout(sunWink, 4000 + Math.random() * 6000);
}
setTimeout(sunWink, 3000);

/* =========  BALLOON MOVEMENT  ========= */
const balloon = document.getElementById('balloon');
const bBody   = document.getElementById('balloonBody');
const knot    = bBody.querySelector('.balloon-knot');

let bx = window.innerWidth / 2 - 35;
let by = window.innerHeight / 2 - 42;
let targetX = bx, targetY = by;
const bSpeed = 0.012;
const bMargin = 60;

function pickTarget() {
  targetX = bMargin + Math.random() * (window.innerWidth  - 2 * bMargin - 70);
  targetY = bMargin + Math.random() * (window.innerHeight - 2 * bMargin - 135);
}
pickTarget();
setInterval(pickTarget, 2000 + Math.random() * 2000);

let wob = 0;
function moveBalloon() {
  bx += (targetX - bx) * bSpeed;
  by += (targetY - by) * bSpeed;
  wob += 0.03;
  balloon.style.transform = `translate(${bx}px, ${by}px) rotate(${Math.sin(wob) * 8}deg)`;
  requestAnimationFrame(moveBalloon);
}
moveBalloon();

/* =========  BALLOON CLICK  ========= */
let isRed = true;
balloon.addEventListener('click', () => {
  const c = isRed ? '#27ae60' : '#e0243a';
  const k = isRed ? '#1e8449' : '#c01e32';
  isRed = !isRed;
  bBody.style.background = c;
  knot.style.background = k;
  bBody.classList.remove('pop');
  void bBody.offsetWidth;
  bBody.classList.add('pop');
});

/* =========  CLOUDS  ========= */
function spawnCloud() {
  const c = document.createElement('div');
  c.className = 'cloud';
  const size = 60 + Math.random() * 100;
  const top  = Math.random() * (window.innerHeight * 0.55);
  c.style.width  = size + 'px';
  c.style.height = size * 0.6 + 'px';
  c.style.top    = top + 'px';
  c.style.left   = -size + 'px';
  c.style.opacity = 0.7 + Math.random() * 0.25;

  const st = document.createElement('style');
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  c.id = id;
  const p1w = size * (0.5 + Math.random() * 0.3);
  const p2w = size * (0.4 + Math.random() * 0.3);
  st.textContent = `
    #${id}::before { width:${p1w}px; height:${p1w*0.7}px; top:-${p1w*0.35}px; left:${size*0.15}px; }
    #${id}::after  { width:${p2w}px; height:${p2w*0.7}px; top:-${p2w*0.2}px;  left:${size*0.45}px; }
  `;
  document.head.appendChild(st);
  document.body.appendChild(c);

  const duration = 30000 + Math.random() * 40000;
  const dest = window.innerWidth + size;
  const start = performance.now();
  function drift(now) {
    const t = (now - start) / duration;
    if (t > 1) { c.remove(); st.remove(); return; }
    c.style.left = (-size + t * (dest + size)) + 'px';
    requestAnimationFrame(drift);
  }
  requestAnimationFrame(drift);
}
for (let i = 0; i < 6; i++) setTimeout(() => spawnCloud(), i * 800);
setInterval(spawnCloud, 6000 + Math.random() * 4000);

/* =========  PLANES  ========= */
let activePlanes = 0;
let currentName = '';

function shouldWrite() {
  return currentName.length >= 3;
}

/* --- Smoke puff trail --- */
function emitSmokePuff(x, y) {
  const puff = document.createElement('div');
  puff.className = 'smoke-puff';
  const size = 6 + Math.random() * 8;
  puff.style.width = size + 'px';
  puff.style.height = size + 'px';
  puff.style.left = (x - size / 2 + (Math.random() - 0.5) * 6) + 'px';
  puff.style.top  = (y - size / 2 + (Math.random() - 0.5) * 6) + 'px';
  puff.style.opacity = '0.6';
  document.body.appendChild(puff);

  const born = performance.now();
  const life = 2000 + Math.random() * 1500;
  function fade(now) {
    const age = (now - born) / life;
    if (age > 1) { puff.remove(); return; }
    const s = size + age * 15;
    puff.style.width  = s + 'px';
    puff.style.height = s + 'px';
    puff.style.opacity = String(0.6 * (1 - age));
    requestAnimationFrame(fade);
  }
  requestAnimationFrame(fade);
}

/* --- Smoke letter writing --- */
function writeSmokeText(text) {
  const letterW = 50;
  const totalW = text.length * letterW;
  const startX = (window.innerWidth - totalW) / 2;
  const textY = 80 + Math.random() * (window.innerHeight * 0.2);

  const letters = [];
  for (let i = 0; i < text.length; i++) {
    const el = document.createElement('div');
    el.className = 'smoke-letter';
    el.textContent = text[i].toUpperCase();
    el.style.left = (startX + i * letterW) + 'px';
    el.style.top  = textY + 'px';
    el.style.opacity = '0';
    el.style.transform = 'scale(0.3)';
    el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    document.body.appendChild(el);
    letters.push(el);
  }

  return {
    letters,
    startX,
    textY,
    totalW,
    letterW,
    reveal(index) {
      if (index < letters.length) {
        letters[index].style.opacity = '1';
        letters[index].style.transform = 'scale(1)';
      }
    },
    fadeOut() {
      letters.forEach(l => {
        l.style.transition = 'opacity 3s ease, transform 3s ease, filter 3s ease';
        l.style.opacity = '0';
        l.style.transform = 'scale(1.3)';
        l.style.filter = 'blur(8px)';
      });
      setTimeout(() => letters.forEach(l => l.remove()), 3500);
    }
  };
}

/* --- Free-flying dynamic plane --- */
function spawnFreePlane() {
  activePlanes++;
  const wrapper = document.createElement('div');
  wrapper.className = 'plane-wrapper';
  const icon = document.createElement('span');
  icon.className = 'plane-icon';
  icon.textContent = '\u2708\ufe0f';
  wrapper.appendChild(icon);

  const goRight = Math.random() > 0.5;
  const baseTop = 40 + Math.random() * (window.innerHeight * 0.35);

  // Multiple wave layers for organic flight
  const w1 = { amp: 30 + Math.random() * 50, freq: 0.4 + Math.random() * 0.6 };
  const w2 = { amp: 15 + Math.random() * 25, freq: 1.2 + Math.random() * 1.0 };
  const w3 = { amp: 8  + Math.random() * 12, freq: 2.5 + Math.random() * 1.5 };

  const startX = goRight ? -100 : window.innerWidth + 100;
  const endX   = goRight ? window.innerWidth + 100 : -100;
  wrapper.style.left = startX + 'px';
  wrapper.style.top  = baseTop + 'px';
  document.body.appendChild(wrapper);

  const duration = 10000 + Math.random() * 8000;
  const start = performance.now();
  let lastPuff = 0;
  let prevY = baseTop;

  function fly(now) {
    const t = (now - start) / duration;
    if (t > 1 || (shouldWrite() && t > 0.1)) {
      wrapper.remove();
      activePlanes--;
      if (shouldWrite()) spawnWritingPlane();
      else spawnFreePlane();
      return;
    }

    const x = startX + t * (endX - startX);
    const y = baseTop
      + Math.sin(t * Math.PI * 2 * w1.freq) * w1.amp
      + Math.sin(t * Math.PI * 2 * w2.freq) * w2.amp
      + Math.sin(t * Math.PI * 2 * w3.freq) * w3.amp;

    const dy = y - prevY;
    prevY = y;
    const bankAngle = (goRight ? 1 : -1) * Math.atan2(dy, 8) * (180 / Math.PI);

    wrapper.style.left = x + 'px';
    wrapper.style.top  = y + 'px';
    icon.style.transform = `scaleX(${goRight ? 1 : -1}) rotate(${bankAngle}deg)`;

    // Emit small smoke puffs behind plane
    if (now - lastPuff > 120) {
      const puffX = goRight ? x : x + 50;
      emitSmokePuff(puffX, y + 22);
      lastPuff = now;
    }

    requestAnimationFrame(fly);
  }
  requestAnimationFrame(fly);
}

/* --- Writing plane that writes the name in smoke --- */
function spawnWritingPlane() {
  if (!shouldWrite()) { spawnFreePlane(); return; }
  activePlanes++;

  const text = currentName;
  const smokeText = writeSmokeText(text);

  const wrapper = document.createElement('div');
  wrapper.className = 'plane-wrapper';
  const icon = document.createElement('span');
  icon.className = 'plane-icon';
  icon.textContent = '\u2708\ufe0f';
  wrapper.appendChild(icon);

  const startX = smokeText.startX - 120;
  const endX   = smokeText.startX + smokeText.totalW + 120;
  const flyY   = smokeText.textY + 25;

  wrapper.style.left = startX + 'px';
  wrapper.style.top  = flyY + 'px';
  document.body.appendChild(wrapper);

  const duration = 4000 + text.length * 600;
  const start = performance.now();
  let lastRevealed = -1;
  let lastPuff = 0;
  let prevY2 = flyY;

  function fly(now) {
    const t = (now - start) / duration;

    if (t > 1) {
      wrapper.remove();
      activePlanes--;
      setTimeout(() => smokeText.fadeOut(), 2000);
      setTimeout(() => {
        if (shouldWrite()) spawnWritingPlane();
        else spawnFreePlane();
      }, 4000);
      return;
    }

    const x = startX + t * (endX - startX);
    const wave = Math.sin(t * Math.PI * 6) * 8 + Math.sin(t * Math.PI * 14) * 3;
    const y = flyY + wave;
    const dy = y - prevY2;
    prevY2 = y;
    const bank = Math.atan2(dy, 10) * (180 / Math.PI);

    wrapper.style.left = x + 'px';
    wrapper.style.top  = y + 'px';
    icon.style.transform = `rotate(${bank}deg)`;

    // Reveal letters as plane passes over them
    const writeStart = 0.08;
    const writeEnd = 0.92;
    if (t >= writeStart && t <= writeEnd) {
      const writeT = (t - writeStart) / (writeEnd - writeStart);
      const letterIdx = Math.floor(writeT * text.length);
      if (letterIdx > lastRevealed && letterIdx < text.length) {
        for (let i = lastRevealed + 1; i <= letterIdx; i++) {
          smokeText.reveal(i);
          const lx = smokeText.startX + i * smokeText.letterW + smokeText.letterW / 2;
          const ly = smokeText.textY + 35;
          for (let p = 0; p < 5; p++) {
            emitSmokePuff(lx + (Math.random() - 0.5) * 40, ly + (Math.random() - 0.5) * 40);
          }
        }
        lastRevealed = letterIdx;
      }
    }

    if (now - lastPuff > 80) {
      emitSmokePuff(x, y + 22);
      lastPuff = now;
    }

    requestAnimationFrame(fly);
  }
  requestAnimationFrame(fly);
}

/* --- Ensure always 2 planes --- */
function ensurePlanes() {
  while (activePlanes < 2) {
    if (shouldWrite()) spawnWritingPlane();
    else spawnFreePlane();
  }
}

spawnFreePlane();
setTimeout(() => { if (activePlanes < 2) spawnFreePlane(); }, 2500);
setInterval(ensurePlanes, 3000);

/* =========  WELCOME TEXT  ========= */
const welcome = document.getElementById('welcome');
welcome.style.left = (window.innerWidth / 2 - 150) + 'px';
welcome.style.top = (window.innerHeight / 2 - 30) + 'px';

welcome.addEventListener('click', () => {
  welcome.classList.remove('shiver');
  void welcome.offsetWidth;
  welcome.classList.add('shiver');
  const newX = 60 + Math.random() * (window.innerWidth - 400);
  const newY = 40 + Math.random() * (window.innerHeight - 160);
  welcome.style.left = newX + 'px';
  welcome.style.top = newY + 'px';
});

/* =========  NAME INPUT  ========= */
const nameInput = document.getElementById('nameInput');
nameInput.addEventListener('input', () => {
  const name = nameInput.value.trim();
  currentName = name;
  welcome.textContent = name ? `Welcome ${name}!` : 'Welcome Dude!';
});

/* =========  RESIZE SAFETY  ========= */
window.addEventListener('resize', pickTarget);
</script>
</body>
</html>
