<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon in the Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #74b9d9 0%, #9ccde6 40%, #bde0ef 100%);
    cursor: default;
  }

  /* ---- Clouds ---- */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(1px);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }

  /* ---- Balloon ---- */
  #balloon {
    position: absolute;
    width: 70px;
    height: 85px;
    cursor: pointer;
    z-index: 10;
    transition: filter 0.15s;
    will-change: transform;
  }
  #balloon:hover { filter: brightness(1.15); }

  .balloon-body {
    width: 70px;
    height: 85px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    box-shadow: inset -8px -5px 14px rgba(0,0,0,0.15), inset 6px 6px 14px rgba(255,255,255,0.35);
    transition: background 0.3s;
  }

  .balloon-knot {
    width: 10px;
    height: 10px;
    background: inherit;
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 3px 0;
  }

  .balloon-string {
    width: 2px;
    height: 50px;
    background: rgba(0,0,0,0.25);
    position: absolute;
    left: 50%;
    top: 85px;
    transform: translateX(-50%);
    border-radius: 0 0 2px 2px;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop { animation: pop 0.35s ease-out; }

  /* ---- Mermaid ---- */
  .mermaid {
    position: absolute;
    font-size: 64px;
    pointer-events: none;
    user-select: none;
    z-index: 5;
    transition: opacity 0.5s;
  }

  /* ---- Lyric bubble ---- */
  .lyric-bubble {
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    border-radius: 18px;
    padding: 8px 16px;
    font-size: 15px;
    font-family: 'Georgia', serif;
    font-style: italic;
    color: #2c3e50;
    pointer-events: none;
    z-index: 6;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    max-width: 320px;
    white-space: normal;
    text-align: center;
    line-height: 1.4;
  }
  .lyric-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 30px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid rgba(255, 255, 255, 0.85);
  }

  /* ---- Musical notes ---- */
  .music-note {
    position: absolute;
    font-size: 24px;
    pointer-events: none;
    z-index: 7;
    user-select: none;
    opacity: 0;
  }
</style>
</head>
<body>

<!-- Balloon -->
<div id="balloon">
  <div class="balloon-body" id="balloonBody" style="background: #e0243a;">
    <div class="balloon-knot" style="background: #c01e32;"></div>
  </div>
  <div class="balloon-string"></div>
</div>

<script>
/* =========  BALLOON MOVEMENT  ========= */
const balloon = document.getElementById('balloon');
const bBody   = document.getElementById('balloonBody');
const knot    = bBody.querySelector('.balloon-knot');

let bx = window.innerWidth / 2 - 35;
let by = window.innerHeight / 2 - 42;
let targetX = bx, targetY = by;
const bSpeed = 0.012;
const bMargin = 60;

function pickTarget() {
  targetX = bMargin + Math.random() * (window.innerWidth  - 2 * bMargin - 70);
  targetY = bMargin + Math.random() * (window.innerHeight - 2 * bMargin - 135);
}
pickTarget();
setInterval(pickTarget, 2000 + Math.random() * 2000);

let wob = 0;
function moveBalloon() {
  bx += (targetX - bx) * bSpeed;
  by += (targetY - by) * bSpeed;
  wob += 0.03;
  balloon.style.transform = `translate(${bx}px, ${by}px) rotate(${Math.sin(wob) * 8}deg)`;
  requestAnimationFrame(moveBalloon);
}
moveBalloon();

/* =========  BALLOON CLICK  ========= */
let isRed = true;
balloon.addEventListener('click', () => {
  const c = isRed ? '#27ae60' : '#e0243a';
  const k = isRed ? '#1e8449' : '#c01e32';
  isRed = !isRed;
  bBody.style.background = c;
  knot.style.background = k;
  bBody.classList.remove('pop');
  void bBody.offsetWidth;
  bBody.classList.add('pop');
});

/* =========  CLOUDS (more prevalent)  ========= */
const cloudElements = [];

function spawnCloud(startRandom) {
  const c = document.createElement('div');
  c.className = 'cloud';
  const size = 80 + Math.random() * 150;
  const top  = Math.random() * (window.innerHeight * 0.7);
  c.style.width  = size + 'px';
  c.style.height = size * 0.6 + 'px';
  c.style.top    = top + 'px';
  c.style.left   = startRandom ? (Math.random() * window.innerWidth) + 'px' : -size + 'px';
  c.style.opacity = 0.75 + Math.random() * 0.2;

  const st = document.createElement('style');
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  c.id = id;
  const p1w = size * (0.5 + Math.random() * 0.4);
  const p2w = size * (0.4 + Math.random() * 0.4);
  st.textContent = `
    #${id}::before { width:${p1w}px; height:${p1w*0.65}px; top:-${p1w*0.3}px; left:${size*0.12}px; }
    #${id}::after  { width:${p2w}px; height:${p2w*0.65}px; top:-${p2w*0.18}px; left:${size*0.4}px; }
  `;
  document.head.appendChild(st);
  document.body.appendChild(c);

  const cloudObj = { el: c, top, size };
  cloudElements.push(cloudObj);

  const duration = 35000 + Math.random() * 35000;
  const dest = window.innerWidth + size;
  const startLeft = parseFloat(c.style.left);
  const start = performance.now();
  function drift(now) {
    const t = (now - start) / duration;
    if (t > 1) {
      c.remove(); st.remove();
      const idx = cloudElements.indexOf(cloudObj);
      if (idx > -1) cloudElements.splice(idx, 1);
      return;
    }
    c.style.left = (startLeft + t * (dest - startLeft + size)) + 'px';
    requestAnimationFrame(drift);
  }
  requestAnimationFrame(drift);
}

// Many initial clouds spread across screen
for (let i = 0; i < 14; i++) setTimeout(() => spawnCloud(true), i * 300);
// Continuous spawning, faster rate
setInterval(spawnCloud, 3000 + Math.random() * 2000);

/* =========  MERMAIDS  ========= */
const lyrics = [
  "I wanna be where the people are",
  "I wanna see, wanna see them dancin'",
  "Walking around on those, what do you call 'em?",
  "Oh, feet!",
  "Flippin' your fins, you don't get too far",
  "Legs are required for jumping, dancing",
  "Strolling along down a, what's that word again?",
  "Street!",
  "Up where they walk, up where they run",
  "Up where they stay all day in the sun",
  "Wanderin' free, wish I could be",
  "Part of that world",
  "What would I give if I could live out of these waters?",
  "What would I pay to spend a day warm on the sand?",
  "Bet'cha on land they understand",
  "Bet they don't reprimand their daughters",
  "Bright young women, sick of swimmin'",
  "Ready to stand!",
  "I'm ready to know what the people know",
  "Ask 'em my questions and get some answers",
  "What's a fire and why does it, what's the word?",
  "Burn!",
  "When's it my turn?",
  "Wouldn't I love, love to explore that shore up above?",
  "Out of the sea, wish I could be",
  "Part of that world",
];
let lyricIndex = 0;

const mermaidEmojis = ['\u{1F9DC}\u200D\u2640\uFE0F', '\u{1F9DC}'];
const noteChars = ['\u{1F3B5}', '\u{1F3B6}', '\u266A', '\u266B'];

function spawnMusicNote(x, y) {
  const note = document.createElement('div');
  note.className = 'music-note';
  note.textContent = noteChars[Math.floor(Math.random() * noteChars.length)];
  note.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
  note.style.top  = y + 'px';
  note.style.opacity = '0';
  document.body.appendChild(note);

  const born = performance.now();
  const life = 2000 + Math.random() * 1500;
  const driftX = (Math.random() - 0.5) * 60;

  function anim(now) {
    const age = (now - born) / life;
    if (age > 1) { note.remove(); return; }
    note.style.left = (x + driftX * age + (Math.random() - 0.5) * 2) + 'px';
    note.style.top  = (y - age * 80) + 'px';
    note.style.opacity = age < 0.15 ? String(age / 0.15) : String(1 - (age - 0.15) / 0.85);
    note.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg) scale(${0.8 + age * 0.5})`;
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

function spawnMermaid() {
  if (cloudElements.length === 0) return;

  // Pick a random cloud to emerge from
  const cloud = cloudElements[Math.floor(Math.random() * cloudElements.length)];
  const cloudRect = cloud.el.getBoundingClientRect();

  const mermaid = document.createElement('div');
  mermaid.className = 'mermaid';
  mermaid.textContent = mermaidEmojis[Math.floor(Math.random() * mermaidEmojis.length)];

  const mx = cloudRect.left + cloudRect.width * 0.3 + Math.random() * cloudRect.width * 0.4;
  const my = cloudRect.top + cloudRect.height * 0.2;

  mermaid.style.left = mx + 'px';
  mermaid.style.top  = my + 'px';
  mermaid.style.opacity = '0';
  document.body.appendChild(mermaid);

  // Lyric bubble
  const bubble = document.createElement('div');
  bubble.className = 'lyric-bubble';
  const lyric = lyrics[lyricIndex % lyrics.length];
  lyricIndex++;
  bubble.textContent = lyric;
  bubble.style.left = (mx - 60) + 'px';
  bubble.style.top  = (my - 60) + 'px';
  bubble.style.opacity = '0';
  bubble.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
  bubble.style.transform = 'translateY(10px)';
  document.body.appendChild(bubble);

  // Sing with SpeechSynthesis
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(lyric);
    utter.rate = 0.85;
    utter.pitch = 1.4;
    utter.volume = 0.7;
    const voices = speechSynthesis.getVoices();
    const femaleVoice = voices.find(v =>
      /female|samantha|karen|victoria|zira|hazel/i.test(v.name)
    ) || voices.find(v => /en/i.test(v.lang)) || voices[0];
    if (femaleVoice) utter.voice = femaleVoice;
    speechSynthesis.speak(utter);
  }

  const born = performance.now();
  const duration = 6000 + lyric.length * 60;
  let lastNote = 0;
  let revealed = false;

  function anim(now) {
    const age = (now - born) / duration;
    if (age > 1) {
      mermaid.remove();
      bubble.remove();
      return;
    }

    let yOff, opacity;
    if (age < 0.15) {
      const t = age / 0.15;
      yOff = (1 - t) * 40;
      opacity = t;
    } else if (age < 0.8) {
      yOff = Math.sin((age - 0.15) * Math.PI * 4) * 6;
      opacity = 1;
    } else {
      const t = (age - 0.8) / 0.2;
      yOff = t * 40;
      opacity = 1 - t;
    }

    mermaid.style.top = (my + yOff) + 'px';
    mermaid.style.opacity = String(opacity);

    if (age > 0.1 && !revealed) {
      bubble.style.opacity = '1';
      bubble.style.transform = 'translateY(0)';
      revealed = true;
    }
    if (age > 0.7) {
      bubble.style.opacity = String(Math.max(0, (0.85 - age) / 0.15));
    }
    bubble.style.top = (my - 60 + yOff) + 'px';

    if (now - lastNote > 400 && age > 0.08 && age < 0.75) {
      spawnMusicNote(mx + 30, my + yOff - 10);
      lastNote = now;
    }

    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

// Ensure voices are loaded
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

// Spawn mermaids regularly
setTimeout(spawnMermaid, 2000);
setInterval(spawnMermaid, 5000 + Math.random() * 3000);

/* =========  RESIZE SAFETY  ========= */
window.addEventListener('resize', pickTarget);
</script>
</body>
</html>
